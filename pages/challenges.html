<!DOCTYPE html>
<html lang=\"en\">
<head>
  <meta charset=\"UTF-8\">
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
  <title>Challenges - Fitness Messer</title>
  <link rel=\"stylesheet\" href=\"../css/global.css\">
  <link rel=\"stylesheet\" href=\"../css/layout.css\">
  <link rel=\"stylesheet\" href=\"../css/components.css\">
  <link rel=\"stylesheet\" href=\"../css/pages/challenges.css\">
</head>
<body>
  <div id=\"app\">
    <main class=\"main-content\">
      <header class=\"page-header\">
        <h1>🎯 Challenges</h1>
        <p>Complete daily and weekly goals for extra rewards</p>
      </header>

      <section class=\"card\">
        <div class=\"card-header\">
          <h2>Daily Challenges</h2>
          <span class=\"badge badge-blue\" id=\"dailyDate\"></span>
        </div>
        <div class=\"challenges-list\" id=\"dailyChallenges\"></div>
      </section>

      <section class=\"card\">
        <div class=\"card-header\">
          <h2>Weekly Challenges</h2>
          <span class=\"badge badge-green\" id=\"weeklyDate\"></span>
        </div>
        <div class=\"challenges-list\" id=\"weeklyChallenges\"></div>
      </section>

      <section class=\"card\">
        <div class=\"card-header\">
          <h2>Completed Challenges</h2>
        </div>
        <div id=\"completedChallenges\">
          <p style=\"color: var(--text-secondary);\">No completed challenges yet</p>
        </div>
      </section>
    </main>
  </div>

  <script src=\"../js/storage.js\"></script>
  <script src=\"../js/data.js\"></script>
  <script src=\"../js/shared-ui.js\"></script>
  <script src=\"../js/pages/challenges.js\"></script>
</body>
</html>
